name: reconciliation

# The published Providence heat figures are defined in sparc-resilience/docs/results/reconciliation.md.
# This workflow fails the build when website source disagrees with it:
#   - a retracted figure appears in src/**/*.ts(x). The forbidden list is read from reconciliation.md,
#     so retracting a figure there extends this gate with no edit here;
#   - a restated figure differs from the manifest, or a Providence R2/RMSE is not registered there;
#   - an internal href="/route" has no page/route/public file, or an href="/route#anchor" has no
#     element with that id.
# External links are checked weekly, never on a push, so a flaky third-party host cannot block a merge.
# Deterministic: regex, parsed manifest, filesystem. No model.
#
# The checker and the manifest live in sparc-resilience (one source of truth). Reading them needs a
# fine-grained token: SPARC_RESILIENCE_READ_TOKEN, Contents: read-only on Kyle-Wire/sparc-resilience.
# If the secret is missing this job FAILS. A gate that silently skips is not a gate.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "41 6 * * 1" # Mondays 06:41 UTC: external links

concurrency:
  group: reconciliation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  figures-and-routes:
    name: figures + internal routes
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_TOKEN: ${{ secrets.SPARC_RESILIENCE_READ_TOKEN }}
    steps:
      - name: Require access to the manifest
        run: |
          if [ -z "$SOURCE_TOKEN" ]; then
            echo "::error title=reconciliation gate NOT enforced::secret SPARC_RESILIENCE_READ_TOKEN is not set (Contents: read on Kyle-Wire/sparc-resilience). Failing instead of skipping."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Kyle-Wire/sparc-resilience
          ref: main
          token: ${{ secrets.SPARC_RESILIENCE_READ_TOKEN }}
          path: .reconciliation-source
          sparse-checkout: |
            /scripts/ci/
            /docs/results/reconciliation.md
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Figures and internal routes
        run: >
          python .reconciliation-source/scripts/ci/check_reconciliation.py
          --root .
          --manifest .reconciliation-source/docs/results/reconciliation.md
          --include "src/**/*.ts" "src/**/*.tsx"
          --site-links
          --summary "$GITHUB_STEP_SUMMARY"

  external-links:
    name: external links (scheduled)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_TOKEN: ${{ secrets.SPARC_RESILIENCE_READ_TOKEN }}
    steps:
      - name: Require access to the checker
        run: |
          if [ -z "$SOURCE_TOKEN" ]; then
            echo "::error title=external link check NOT running::secret SPARC_RESILIENCE_READ_TOKEN is not set"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Kyle-Wire/sparc-resilience
          ref: main
          token: ${{ secrets.SPARC_RESILIENCE_READ_TOKEN }}
          path: .reconciliation-source
          sparse-checkout: |
            /scripts/ci/
            /docs/results/reconciliation.md
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: External links
        run: >
          python .reconciliation-source/scripts/ci/check_reconciliation.py
          --root .
          --manifest .reconciliation-source/docs/results/reconciliation.md
          --include "src/**/*.ts" "src/**/*.tsx"
          --site-links --no-numbers --external
          --summary "$GITHUB_STEP_SUMMARY"
